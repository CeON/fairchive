<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">

<h:body>
	<f:metadata>
		<f:viewParam name="dataverseId"
			value="#{ExportSearchResultsPage.rootDataverse.id}" />
		<f:viewAction action="#{dataverseSession.updateLocaleInViewRoot}" />
		<f:viewAction action="#{ExportSearchResultsPage.verifyAccess()}" />
		<f:viewAction
			action="#{dataverseHeaderFragment.initBreadcrumbs(ExportSearchResultsPage.rootDataverse)}" />
		<f:viewAction
			action="#{dataverseHeaderFragment.addBreadcrumb('/dashboard.xhtml?dataverseId='.concat(ExportSearchResultsPage.getRootDataverse().getId()), bundle['dashboard.title'])}" />
		<f:viewAction
			action="#{dataverseHeaderFragment.addBreadcrumb(bundle['dashboard.card.exportsearchresults.manage'])}" />
	</f:metadata>

	<ui:composition template="/dataverse_template.xhtml">
		<ui:param name="pageTitle"
			value="#{bundle['dashboard.card.exportsearchresults.header']}" />
		<ui:param name="showDataverseHeader" value="false" />
		<ui:define name="body">
			<h:form id="form"
				onkeypress="return event.keyCode != 13">
				<!-- Metadata selections -->
				<ui:repeat value="#{ExportSearchResultsPage.blocks}" 
				           var="block">
				    <ui:fragment rendered="#{not empty block.datasetFieldTypes}">
						<h2 style="text-muted">#{block.localeDisplayName}</h2>
				        <h:commandLink value="#{bundle.selectAll}" 
	                                   action="#{ExportSearchResultsPage.selectAll(block, true)}">
	                        <f:ajax render="@form" />
	                    </h:commandLink>
	                    |
	                    <h:commandLink value="#{bundle.deselectAll}" 
	                                   action="#{ExportSearchResultsPage.selectAll(block, false)}">
	                        <f:ajax render="@form" />
	                    </h:commandLink>
						<ul style="border: 1px solid #e8e8e8; padding: 5px; list-style-type: none;"
						    role="group" 
	                              aria-label="#{block.localeDisplayName}">
							<ui:repeat value="#{block.datasetFieldTypes}" 
							           var="fieldType">
								<li jsf:rendered="#{fieldType.hasChildren}">
								  <h:outputText value="#{fieldType.displayName}"
	                                                     escape="false" />
	                                     </li>
	                                     <li jsf:rendered="#{!fieldType.hasChildren}"
	                                         style="#{fieldType.hasParent ? 'padding-left: 2em;' : ''}">
								  <p:selectBooleanCheckbox 
										value="#{fieldType.exportToFile}"
										itemLabel="#{fieldType.displayName}" 
										escape="false"
										disabled="#{not fieldType.isExportableToFile()}"/>
								</li>
							</ui:repeat>
						</ul>
					</ui:fragment>
				</ui:repeat>
				<!-- Bottom action buttons -->
				<p:commandButton id="save"
				                 styleClass="btn btn-default"
					             value="#{bundle.saveChanges}"
					             action="#{ExportSearchResultsPage.save}"
					             update="@form,:messagePanel," />
				<p:commandButton id="cancel"
				                 styleClass="btn btn-default"
					             value="#{bundle.cancel}"
					             action="#{ExportSearchResultsPage.cancel}"
					             process="@this">
					<p:resetInput target="@form" />
				</p:commandButton>
			</h:form>
		</ui:define>
	</ui:composition>

</h:body>
</html>
