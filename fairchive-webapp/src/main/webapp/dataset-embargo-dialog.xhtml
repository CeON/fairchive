<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
     xmlns:h="http://java.sun.com/jsf/html"
     xmlns:f="http://java.sun.com/jsf/core"
     xmlns:ui="http://java.sun.com/jsf/facelets"
     xmlns:c="http://java.sun.com/jsp/jstl/core"
     xmlns:p="http://primefaces.org/ui"
     xmlns:o="http://omnifaces.org/ui"
     xmlns:jsf="http://xmlns.jcp.org/jsf"
     xmlns:dv="http://dataverse.org/facelets">

<p:dialog id="setEmbargo" 
          styleClass="smallPopUp" 
          header="#{bundle['dataset.embargo.header']}"
          widgetVar="setEmbargo"
          modal="true"
          dynamic="true">
    <h:form id="embargoForm">
        <p class="help-block">
            <h:outputFormat value="#{bundle['dataset.embargo.description.message']}"
                            escape="false"
                            rendered="#{datasetEmbargoDialog.userAbleToSetOrUpdateEmbargo}">
                <br />
            </h:outputFormat>
            <h:outputFormat value="#{bundle['dataset.embargo.max.message']}"
                            escape="false"
                            rendered="#{datasetEmbargoDialog.displayMaxEmbargoMessage()}">
                <f:param value="#{datasetEmbargoDialog.maximumEmbargoLength}"/>
                <br />
            </h:outputFormat>
            <h:outputFormat value="#{bundle['dataset.embargo.message']}"
                            escape="false"
                            rendered="#{datasetEmbargoDialog.currentEmbargoDateSet}">
                <f:param value="#{datasetEmbargoDialog.currentEmbargoDateForDisplay}"/>
                <br />
            </h:outputFormat>
        </p>
        <div jsf:rendered="#{datasetEmbargoDialog.userAbleToSetOrUpdateEmbargo}">
            <p:outputLabel for="embargoDatePicker" 
                           value="#{bundle['dataset.embargo.calendar.label']}">
             <span class="glyphicon glyphicon-question-sign tooltip-icon" 
                   tabindex="0"
                   role="button"
                   data-toggle="tooltip" 
                   data-placement="auto right"
                   data-original-title="#{bundle['dataset.embargo.calendar.label.tip']}"/>
            </p:outputLabel>
            <p:calendar id="embargoDatePicker"
                        value="#{datasetEmbargoDialog.currentEmbargoDate}"
                        showButtonBar="true"
                        mindate="#{datasetEmbargoDialog.tomorrowsDate}"
                        maxdate="#{datasetEmbargoDialog.maximumEmbargoDate}"
                        effect="drop"
                        navigator="true"
                        pattern="#{datasetEmbargoDialog.defaultDateFormat}"
                        validator="#{datasetEmbargoDialog.validateEmbargoDate}"
                        locale="#{dataverseSession.localeCode}"
                        timeZone="UTC"
                        mode="inline"/>
            <p:message id="embargoMsg" 
                       for="embargoDatePicker" 
                       display="text" />
        </div>
        <div class="button-block">
            <p:commandButton value="#{bundle['dataset.embargo.set.button']}"
                             action="#{datasetEmbargoDialog.updateEmbargoDate()}"
                             update="embargoForm,:messagePanel"
                             rendered="#{datasetEmbargoDialog.userAbleToSetOrUpdateEmbargo}"
                             oncomplete="if (args &amp;&amp; !args.validationFailed) {
                                            PF('setEmbargo').hide();
                                         } else {
                                            #{datasetEmbargoDialog.initCurrentEmbargo()};
                                         }" />
            <p:commandButton value="#{bundle['dataset.embargo.lift.button']}"
                             onclick="PF('setEmbargo').hide();
                                      PF('removeEmbargoConfirmation').show()"
                             rendered="#{datasetEmbargoDialog.userAbleToLiftEmbargo}" 
                             type="button"/>
            <p:commandButton styleClass="btn btn-default"
                             value="#{bundle.close}"
                             onclick="PF('setEmbargo').hide();"
                             update="embargoForm, embargoDatePicker"
                             resetValues="true" />
        </div>
    </h:form>
</p:dialog>
    
<!-- Confirm embargo lift -->
<p:dialog styleClass="smallPopUp" 
          header="#{bundle['dataset.embargo.header']}"
          widgetVar="removeEmbargoConfirmation" 
          modal="true" 
          closable="false">
    <h:form id="removeEmbargoConfirmationForm">
        <p class="text-warning">
            <span class="glyphicon glyphicon-warning-sign"/>
            #{bundle['dataset.embargo.lift.confirmationText']}
        </p>
        <p jsf:rendered="#{datasetEmbargoDialog.hasDatasetEverBeenPublished()}" 
           class="text-warning">
            <span class="glyphicon glyphicon-warning-sign"/>
            #{bundle['dataset.embargo.lift.publishedConfirmationText']}
        </p>
        <div class="button-block">
            <p:commandButton value="#{bundle['dataset.embargo.lift.confirmButton']}"
                             immediate="true"
                             action="#{datasetEmbargoDialog.liftEmbargo()}"
                             update=":messagePanel"
                             onclick="PF('removeEmbargoConfirmation').hide();" />
            <p:commandButton value="#{bundle.cancel}"
                             onclick="PF('removeEmbargoConfirmation').hide();
                                      PF('setEmbargo').show();"
                             type="button" />
        </div>
    </h:form>
</p:dialog>

</ui:composition>
