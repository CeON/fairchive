<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf">

<h:body>
    <ui:composition template="/dataverse_template.xhtml">
        <ui:param name="pageTitle" value="#{metadataPage.title}"/>
       <ui:param name="page" value="#{metadataPage}"/>
        <ui:define name="body">
            <f:metadata>
                <f:viewParam name="id" value="#{page.dataverseId}"/>
                <f:viewAction action="#{dataverseSession.updateLocaleInViewRoot}"/>
                <f:viewAction action="#{page.init}"/>
                <f:viewAction action="#{dataverseHeaderFragment.initBreadcrumbs(page.dataverse, bundle['file.metadata'])}"/>
            </f:metadata>

                    <p:panel styleClass="panelLayoutBlock row"
                     widgetVar="optionBlock"
                     id="optionBlock">

                <div class="row"
                     role="group"
                     aria-labelledby="metadataElementsGroupName">
                    <div id="metadataElementsGroupName"
                         class="col-md-3 col-md-24-3 control-label section-title">#{bundle['dataverse.metadataElements']}</div>
                    <div class="col-md-9 col-md-24-21">
                        <p class="help-block">#{bundle['dataverse.metadataElements.tip']}</p>
                        <label jsf:rendered="#{page.isDataverseNotRoot()}"
                               class="metadata-blocks-default">
                            <h:selectBooleanCheckbox id="metadataRoot" 
                                                     styleClass="metadata-blocks-default fancy-checkbox"
                                                     value="#{page.inheritMetaBlocksFromParent}"
                                                     onclick="updateMetadata(this);"/>
                            <span>
                                <h:outputFormat value="#{bundle['dataverse.metadataElements.from.tip']}">
                                    <f:param value="#{page.metadataParentRootDataverseName}"/>
                                </h:outputFormat>
                            </span>
                        </label>

                        <p:remoteCommand name="makeMetadataBlockSelectable"
                                         update="@widgetVar(optionBlock)"
                                         process="@this @widgetVar(optionBlock)"
                                         actionListener="#{page.makeMetadataBlocksSelectable()}" />

                        <ui:repeat value="#{page.allMetadataBlocks}" 
                                   var="mdb">
                            <div class="checkbox">
                                <label>
                                    <input jsf:rendered="#{mdb.isCitationMetaBlock() and !page.inheritMetaBlocksFromParent}"
                                           type="checkbox" 
                                           jsf:itemValue="#{mdb}" 
                                           id="#{mdb.idString}"
                                           jsf:value="#{page.getBlockViewOptionsFor(mdb).selected}"
                                           name="mdbSelectRequired" 
                                           disabled="" 
                                           checked="checked"/>
                                    <input jsf:rendered="#{!mdb.isCitationMetaBlock() and !page.inheritMetaBlocksFromParent}"
                                           type="checkbox" 
                                           jsf:itemValue="#{mdb}"
                                           id="#{mdb.idString}"
                                           jsf:value="#{page.getBlockViewOptionsFor(mdb).selected}"
                                           name="mdbSelectOptional">
                                        <p:ajax update="@widgetVar(optionBlock)" 
                                                onsuccess="#{page.refreshDatasetFieldTypes(mdb.id,
                                                           page.getBlockViewOptionsFor(mdb).selected,
                                                           page.showFieldTypes(mdb))}" />
                                    </input>
                                    <input jsf:rendered="#{page.inheritMetaBlocksFromParent}"
                                           type="checkbox" 
                                           jsf:itemValue="#{mdb}" 
                                           id="#{mdb.idString}"
                                           jsf:value="#{page.getBlockViewOptionsFor(mdb).selected}"
                                           name="mdbSelectRequiredInherited" 
                                           disabled="disabled">
                                        <p:ajax update="@widgetVar(optionBlock)" 
                                                onsuccess="#{page.refreshDatasetFieldTypes(mdb.id,
                                                           page.getBlockViewOptionsFor(mdb).selected,
                                                           page.showFieldTypes(mdb))}" />
                                    </input>
                                    <h:outputText
                                            value="#{mdb.localeDisplayName} #{mdb.isCitationMetaBlock() ? bundle['dataverse.field.required']: ''}"
                                            styleClass="#{page.inheritMetaBlocksFromParent ? 'text-muted' : ''}"/>
                                </label>

                                    <p:commandLink rendered="#{page.displayEditableDatasetFieldTypesLinkFor(mdb)}"
                                                   actionListener="#{page.showEditableDatasetFieldTypes(mdb)}"
                                                   id="showEditableDSFT" 
                                                   style="margin-left:1em;"
                                                   update="@widgetVar(optionBlock)"
                                                   process="@this">
                                        <h:outputFormat value="#{bundle['dataverse.field.set.tip']}" 
                                                        escape="false">
                                            <f:param value="#{mdb.localeDisplayName}" />
                                        </h:outputFormat>
                                    </p:commandLink>
                                    <p:commandLink rendered="#{page.displayUnEditableDatasetFieldTypesLinkFor(mdb)}"
                                                   id="viewUnEditableDSFT" 
                                                   style="margin-left:1em;"
                                                   update="@widgetVar(optionBlock)"
                                                   process="@this"
                                                   actionListener="#{page.showUnEditableDatasetFieldTypes(mdb)}">
                                        <h:outputFormat value="#{bundle['dataverse.field.set.view']}"
                                                        escape="false">
                                            <f:param value="#{mdb.localeDisplayName}" />
                                        </h:outputFormat>
                                    </p:commandLink>
                            </div>

                            <p:outputPanel id="metadataFieldOptionsPanel"
                                           rendered="#{page.showFieldTypes(mdb)}">
                                <div class="panel panel-default">
                                    <div id="metadataFieldOptionsPanel-Body"
                                         class="panel-body"
                                         role="group"
                                         aria-label="#{mdb.localeDisplayName}">
                                        <p:outputPanel id="metadataFieldOptionsPanelContent" >
                                        <ul>
                                            <ui:repeat value="#{mdb.datasetFieldTypes}"
                                                       var="dsft">
                                            <li class="clearfix">
                                            
                                            <fieldset jsf:rendered="#{dsft.hasParent}">
                                                <legend class="col-xs-7 child-field">
                                                    <h:outputText value="#{dsft.displayName}"
                                                                  escape="false"/>
                                                </legend>
                                                <div class="col-xs-5">
                                                    <p:selectOneRadio value="#{page.getFieldTypeViewOptionsFor(dsft).requiredField}"
                                                                      disabled="#{!page.isEditableDatasetFieldTypes(mdb)
                                                                                    or page.inheritMetaBlocksFromParent}"
                                                                      rendered="#{!dsft.required}">
                                                        <f:selectItems
                                                                value="#{page.getFieldTypeViewOptionsFor(dsft).selectedDatasetFields}"/>
                                                        <p:ajax/>
                                                    </p:selectOneRadio>

                                                    <span class="text-muted" jsf:rendered="#{dsft.required}">
                                                        #{bundle['dataverse.field.requiredByDataverse']}
                                                    </span>
                                                </div>
                                            </fieldset>
                                            
                                            <div jsf:rendered="#{!dsft.hasParent}">
                                                 <p:selectBooleanCheckbox
                                                         styleClass="col-xs-7"
                                                         value="#{page.getFieldTypeViewOptionsFor(dsft).included}"
                                                         itemLabel="#{dsft.displayName}"
                                                         escape="false"
                                                         disabled="#{page.isSelectionDisabledFor(mdb, dsft)}">
                                                     <p:ajax update="#{p:resolveClientIds('@id(metadataFieldOptionsPanelContent)', view)}"
                                                             onsuccess="#{page.refreshDatasetFieldsViewOptions(mdb, dsft)}"/>
                                                 </p:selectBooleanCheckbox>

                                                 <div class="col-xs-5">
                                                    <p:selectOneRadio rendered="#{not dsft.isRequiredOrHasRequiredChild()}"
                                                                      value="#{page.getFieldTypeViewOptionsFor(dsft).requiredField}"
                                                                      disabled="#{page.radioButtonsDisabledFor(mdb)}">
                                                        <f:selectItems
                                                                value="#{page.getSelectedDatasetFieldsOf(dsft)}"/>
                                                        <p:ajax/>
                                                    </p:selectOneRadio>
                                                 </div>
                                                 <span jsf:rendered="#{dsft.isRequiredOrHasRequiredChild()}"
                                                       class="text-muted col-xs-5">
                                                    #{bundle['dataverse.field.requiredByDataverse']}
                                                 </span>
                                            </div>
                                            </li>
                                            </ui:repeat>
                                        </ul>
                                        
                                        </p:outputPanel>
                                    </div>
                                </div>
                                <o:outputFormat value="#{bundle['dataverse.field.hideBtn.ariaLabel']}" 
                                                var="fieldsHideBtnAriaLabel">
                                    <f:param value="#{mdb.localeDisplayName}" />
                                </o:outputFormat>
                                <p:commandButton id="hideDSFT" 
                                                 styleClass="btn btn-default"
                                                 update="@widgetVar(optionBlock)"
                                                 actionListener="#{page.hideDatasetFieldTypes(mdb.id)}"
                                                 immediate="true"
                                                 value="#{bundle['dataverse.field.hideBtn.label']}"
                                                 ariaLabel="#{fieldsHideBtnAriaLabel}" />
                            </p:outputPanel>
                        </ui:repeat>
                    </div>
                </div>
            </p:panel>
            <!-- Facets Panel -->
            <p:panel id="editFacets" 

        </ui:define>
    </ui:composition>
</h:body>
</html>
