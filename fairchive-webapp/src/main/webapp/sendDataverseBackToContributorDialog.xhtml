<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui" 
    xmlns:o="http://omnifaces.org/ui"
    xmlns:jsf="http://xmlns.jcp.org/jsf">

    <p:dialog id="sendBackToContributorDialog"
              header="#{bundle['dataset.rejectBtn']}"
              widgetVar="sendBackToContributorDialog"
              modal="true" 
              dynamic="true"
              cache="false"
              styleClass="largePopUp">

        <h:form id="sandBackToContributorForm">
            <div class="row">
                <label for="message" 
                       class="col-sm-4 control-label">#{bundle['dataset.reject.messageBox.label']}
                    <span class="glyphicon glyphicon-asterisk text-danger" 
                          title="#{bundle.requiredField}"/>
                </label>
                <div class="col-sm-8">
                    <p:inputTextarea id="message" 
                                     rows="20"
                                     value="#{dialog.message}"
                                     maxlength="7000"
                                     cols="60"
                                     counter="counter"
                                     counterTemplate="#{bundle['dataset.reject.messageBox.counter']}"
                                     autoResize="false"
                                     required="true"
                                     requiredMessage="#{bundle['dataset.reject.enterReason']}"
                                     styleClass="form-control">
                    </p:inputTextarea>
                    <p:watermark for="message"
                                 value="#{bundle['dataverse.rejectWatermark']}"/>
                    <h:outputText id="counter" />
                </div>
            </div>
            <div class="row">
                <label for="replyTo" 
                       class="col-sm-4 control-label">
                    #{bundle['dataset.reject.reply.to.label']}
                    <span class="glyphicon glyphicon-asterisk text-danger" 
                          title="#{bundle.requiredField}"/>
                    <span class="glyphicon glyphicon-question-sign tooltip-icon"
                          tabindex="0" 
                          role="button"
                          data-toggle="tooltip" 
                          data-placement="auto right"
                          data-original-title="#{bundle['dataverse.reject.reply.to.tooltip']}"></span>
                </label>
                <div class="col-sm-8">
                    <p:inputText id="replyTo"
                                 styleClass="form-control"
                                 value="#{dialog.replyTo}"
                                 required="true"
                                 requiredMessage="#{bundle['requiredField']}"
                                 validator="#{dialog.validateReplyToEmail}"
                                 validatorMessage="#{bundle['dataset.reject.reply.to.invalid.mail']}">
                    </p:inputText>
                    <br/>
                    <h:message for="replyTo" styleClass="bg-danger text-danger"/>
                </div>
            </div>  
            <div class="row">
                <div class="col-sm-4"></div>
                <div class="col-sm-8">
                    <p:selectBooleanCheckbox value="#{dialog.sendCopy}"
                                             itemLabel="#{bundle['dataset.reject.reply.to.sendCopy']}"/>
                </div>
          </div>         
            <div class="button-block">
                <p:commandButton value="#{bundle.ok}"
                                 action="#{dialog.send()}"
                                 oncomplete="if (args &amp;&amp; !args.validationFailed) PF('sendBackToContributorDialog').hide();"
                                 update="#{updatableComponents}"
                                 process="@form"
                                 styleClass="btn btn-default btn-access" />
                <p:commandButton value="#{bundle.cancel}"
                                 onclick="PF('sendBackToContributorDialog').hide();" 
                                 type="button"/>
            </div>
        </h:form>
    </p:dialog>
</ui:composition>
